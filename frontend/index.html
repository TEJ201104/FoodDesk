<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodDesk — Manage Smart. Serve Fast.</title>
    <meta name="description" content="The Smarter Way to Manage Every Order. Multi-stall Point of Sale (POS), billing, payment tracking, and business analytics platform." />
    <!-- Preconnect & Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-navy-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen" style="background-color: #090d16; color: #f8fafc; margin: 0;">
    <div id="root">
      <!-- Lightweight pre-mount splash: displays immediately before React compiles/mounts -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #090d16; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center;">
          <div style="width: 36px; height: 36px; border: 3px solid rgba(249, 115, 22, 0.2); border-top-color: #f97316; border-radius: 50%; animation: fd-spin 0.8s linear infinite; margin: 0 auto 14px;"></div>
          <div style="font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;">Food<span style="color: #f97316;">Desk</span></div>
          <div style="font-size: 11px; color: #64748b; margin-top: 4px;">Manage Smart. Serve Fast.</div>
        </div>
      </div>
      <style>
        @keyframes fd-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171; background-color: #090d16;">
        JavaScript is required to run FoodDesk. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
